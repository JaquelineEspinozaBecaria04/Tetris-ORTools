---
applications:
- name: tetris-ortools-app   # <-- ¡Elige un nombre único!
  memory: 2G                  # Empezamos con 1GB por ortools/pandas. Puedes ajustarlo luego.
  random-route: true
  buildpack: python_buildpack
  command: gunicorn --timeout 180 -w 4 -k uvicorn.workers.UvicornWorker backend.main:app