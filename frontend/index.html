<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <title>VM Packing — CP-SAT</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <!-- estilos -->
  <link rel="stylesheet" href="/static/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@600;800&display=swap" rel="stylesheet">

</head>
<body>
<header class="page-header">
  <div class="brand">
    <img src="/media/Telcel_logo.png" alt="Logo izquierdo" class="logo logo-left">
    <div class="titles">
      <h1>Telcel Capacity Planning</h1>
      <p class="subtitle">Optimización de VMs</p>
    </div>
    <img src="/media/LogoCID.jpg" alt="Logo derecho" class="logo logo-right">
  </div>
</header>
  <div class="wrap">
    <!-- ENTRADA (full width) -->
    <div class="card">
      <div class="section-title">Entrada</div>
      <div class="grid">
        <div class="grid-item">
          <label>CSV del catálogo</label>
          <input type="file" id="csvFile" accept=".csv"/>
        </div>
        <div class="grid-item">
          <label>Separador (CSV)</label>
          <select id="delimiter">
            <option value="">Auto</option>
            <option value=",">Coma (,)</option>
            <option value=";">Punto y coma (;)</option>
            <option value="\t">Tab</option>
            <option value="|">Barra (|)</option>
          </select>
        </div>
        <div class="grid-item">
          <label>Algoritmo</label>
          <select id="algo">
            <option value="cpsat2">CP-SAT (2 fases)</option>
            <option value="cpsat">CP-SAT (1 fase)</option>
          </select>
        </div>
        <div class="grid-item">
          <label>Acciones</label>
          <div class="row">
            <button id="btnRun" class="btn primary">Ejecutar</button>
            <!-- STOP cancela la petición actual (AbortController) -->
            <button id="btnStop" class="btn danger" disabled>STOP</button>
            <!-- Descargar PNG generado -->
            <a id="btnDownload" class="btn success" style="display:none;" download="acomodo.png">Descargar PNG</a>
            <a id="btnDownloadCSV" class="btn success" href="#" download="tetris.csv">Descargar CSV</a>
          </div>
        </div>
      </div>
      <div class="row">
        <label for="outputFormat">Formato de salida</label>
        <select id="outputFormat">
          <option value="html" selected>HTML interactivo (Plotly)</option>
          <option value="png">PNG</option>
          <option value="both">Ambos</option>
        </select>
      </div>
      <div class="legend">Columnas: Inst, VNF, VNFC, Color, Longitud, AZ, Anti-afinidad, Requerimiento</div>
    </div>
    <!-- RESULTADOS (full width) -->
    <div class="card">
      <div class="section-title">Resultados</div>
      <div id="stats" class="stats"></div>
      <div id="layout" class="layout"><i class="hint">Sube un CSV y ejecuta para ver el layout…</i></div>
    </div>
  </div>
  <!-- lógica JS -->
  <script src="/static/app.js"></script>
</body>
</html>
